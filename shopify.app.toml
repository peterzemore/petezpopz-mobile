# PetezPopz Shopify App Configuration
# Modern unified app config — replaces all legacy scope declarations.
# See: https://shopify.dev/docs/apps/app-extensions/configuration

name = "PetezPopz"
client_id = "b2686c7d161c4dd5e2b99337d214e56b"
application_url = "https://www.petezpopz.com"
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "gemcitytoyco.myshopify.com"

[access_scopes]
# Admin API scopes — read_customers required for loyalty metafield reads via Admin,
# write_customers if server-side loyalty writes are added in future.
# Products/Collections are served through the public Storefront API; no Admin scope needed.
scopes = "read_products,read_customers,write_customers,read_orders,read_metaobjects,write_metaobjects"

[auth]
redirect_urls = [
  "petezpopz://auth/callback",
  "https://www.petezpopz.com/auth/callback",
  "http://localhost:8081/auth/callback"
]

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "https://www.petezpopz.com/webhooks/orders-paid"

  [[webhooks.subscriptions]]
  topics = ["orders/refunded"]
  uri = "https://www.petezpopz.com/webhooks/orders-refunded"

[pos]
embedded = false
